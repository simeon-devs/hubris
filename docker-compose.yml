services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hubris
      POSTGRES_PASSWORD: hubris
      POSTGRES_DB: hubris
    ports:
      - "5432:5432"
    volumes:
      - hubris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubris"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hubris:hubris@db:5432/hubris
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # T-19: defaults to OSRM's public demo server (hubris/engine/routing.py's
      # own default) — override to point at a self-hosted OSRM instance
      # (e.g. http://osrm:5000) without any code change.
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    # Apply the canonical schema (T-05) before serving: `docker compose up`
    # on a fresh clone must give a working stack with no manual migration
    # step. `alembic upgrade head` is idempotent, and `depends_on` already
    # gates this on the db passing its healthcheck.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn hubris.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/hubris:/app/hubris

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  hubris_pgdata:
