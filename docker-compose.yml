services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hubris
      POSTGRES_PASSWORD: hubris
      POSTGRES_DB: hubris
    ports:
      - "5432:5432"
    volumes:
      - hubris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubris"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hubris:hubris@db:5432/hubris
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/hubris:/app/hubris

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  hubris_pgdata:
